version = '1.0'
project.ext {
    type = "server"
}

apply plugin: 'application'
apply plugin: 'kotlin'
apply plugin: 'org.openjfx.javafxplugin'

// Server Panel: in-process JavaFX ops dashboard launched from io.dm.Server.main().
// Only controls + graphics are needed (pure-code UI, no FXML/media/web).
javafx {
    version = "21"
    modules = ['javafx.controls', 'javafx.graphics']
}

compileKotlin {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

dependencies {
    implementation project(':kronos-api')
    // RSProt networking layer (rev 239). See MIGRATION.md for the port from io.dm.network.*.
    implementation project(':dm-net')
    // Whirlpool digest for the JS5 master index signature (io.dm.network.rsprot.RsProt).
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    implementation("org.mindrot:jbcrypt:0.4")
    implementation group: 'com.typesafe', name: 'config', version:'1.3.1'
    implementation group: 'net.dv8tion', name: 'JDA', version: '5.5.1'
    implementation group: 'org.jsoup', name: 'jsoup', version: '1.15.3'
    implementation group: 'io.undertow', name: 'undertow-core', version: '2.3.21.Final'
    implementation 'com.mashape.unirest:unirest-java:1.4.9'
    //compile group: 'de.brudaswen.kotlinx.coroutines', name: 'kotlinx-coroutines-swt', version: '1.0.0'
    implementation group: 'org.jetbrains.kotlinx', name: 'kotlinx-coroutines-core', version: '1.3.7'
    implementation group: 'org.jetbrains.kotlin', name: 'kotlin-stdlib', version:'2.1.21'
    implementation group: 'com.ea.agentloader', name: 'ea-agent-loader', version: '1.0.3'
    // https://mvnrepository.com/artifact/com.fasterxml.jackson.dataformat/jackson-dataformat-yaml
    implementation group: 'com.fasterxml.jackson.dataformat', name: 'jackson-dataformat-yaml', version: '2.11.0'

}

application {
    mainClassName = 'io.dm.Server'
}

application {
    mainClassName = 'io.dm.Server'
    applicationDefaultJvmArgs = [
            "--add-exports=java.base/jdk.internal.vm=ALL-UNNAMED",
            // Was -Xmx8g. That was papering over a real bug: SigilPurchaseScreen's static block
            // indexed InterfaceHandler.actions[-1] for its placeholder enum constants, and
            // InterfaceHandler.register's "retry with a doubled array" recovery can never fix a
            // negative index, so it looped forever doubling the array size toward an
            // OutOfMemoryError on every single boot (see git history 2026-07-18 for the fix, both
            // the actual bug and a hard cap on InterfaceHandler.register's retry growth). Measured
            // post-fix via jcmd GC.heap_info after a full boot with zero players: ~2GB used /
            // ~3.5GB committed. 4g leaves real headroom for live players without the previous
            // 8g ceiling masking future bugs of this same shape.
            "-Xmx4g"
    ]
}

compileJava {
    options.compilerArgs.addAll([
            '--add-exports=java.base/jdk.internal.vm=ALL-UNNAMED'
    ])
}